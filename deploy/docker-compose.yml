# Compact profile for one client's own server (doc 8.4). Also the local "everything running" setup for developers.
#   cp deploy/.env.example deploy/.env   # then set real passwords
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Checked end to end by deploy/smoke-test.sh (also on every pull request, CI job "compose").
name: treasury

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: treasury
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  db-init:
    image: postgres:17
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CASHFLOW_DB_PASSWORD: ${CASHFLOW_DB_PASSWORD:?set in .env}
      REFERENCE_DB_PASSWORD: ${REFERENCE_DB_PASSWORD:?set in .env}
      FISCAL_YEARS: ${FISCAL_YEARS:-1404:2025-03-21:2026-03-20 1405:2026-03-21:2027-03-20}
    volumes:
      - ../db/postgres:/db:ro
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        bash /db/apply.sh treasury
        psql -v ON_ERROR_STOP=1 -d treasury -c "ALTER ROLE cashflow_svc PASSWORD '$${CASHFLOW_DB_PASSWORD}'"
        psql -v ON_ERROR_STOP=1 -d treasury -c "ALTER ROLE reference_svc PASSWORD '$${REFERENCE_DB_PASSWORD}'"
        for fy in $${FISCAL_YEARS}; do
          IFS=: read y s e <<< "$$fy"
          psql -v ON_ERROR_STOP=1 -d treasury -c "SELECT cashflow.open_fiscal_year($$y, '$$s', '$$e')"
        done

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--http-relative-path=/auth"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"

  cashflow-api:
    build:
      context: ..
      dockerfile: src/Services/Cashflow/Treasury.Cashflow.Api/Dockerfile
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      ConnectionStrings__Treasury: "Host=postgres;Database=treasury;Username=cashflow_svc;Password=${CASHFLOW_DB_PASSWORD}"
      # Until the shell's Keycloak login is built (next Phase 0 step) the API runs in Development mode WITHOUT login.
      # Never expose this setup to a network. Set both values below once the "treasury" realm exists.
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Development}
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY:-}
      Keycloak__Audience: treasury
      Development__OpenFiscalYears__0: "1404"
      Development__OpenFiscalYears__1: "1405"

  # Basic Information lists (reference-svc). Same login rules as cashflow-api.
  reference-api:
    build:
      context: ..
      dockerfile: src/Services/Reference/Treasury.Reference.Api/Dockerfile
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      ConnectionStrings__Treasury: "Host=postgres;Database=treasury;Username=reference_svc;Password=${REFERENCE_DB_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Development}
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY:-}
      Keycloak__Audience: treasury

  remote-basic-info:
    build:
      context: ../frontend
      args: { APP: remotes/basic-info, REMOTE_BASE_URL: /remotes/basic-info/ }

  remote-receipts:
    build:
      context: ../frontend
      args: { APP: remotes/receipts, REMOTE_BASE_URL: /remotes/receipts/ }

  shell:
    build:
      context: ../frontend
      args: { APP: shell }
    volumes:
      - ./shell-config.json:/usr/share/nginx/html/shell-config.json:ro

  gateway:
    image: nginx:1.29-alpine
    depends_on: [shell, remote-receipts, remote-basic-info, cashflow-api, reference-api, keycloak]
    ports:
      # Only this computer can open the system unless GATEWAY_ADDRESS=0.0.0.0 is set (there is no login yet).
      - "${GATEWAY_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
