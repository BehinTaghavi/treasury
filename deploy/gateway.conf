# Single entry point (compact on-premises profile). Production: TLS terminates here (certificates mounted in /etc/nginx/certs).
server {
  listen 80;
  client_max_body_size 20m;
  # $http_host keeps the port the browser used (e.g. :8080); with $host, Keycloak and redirects would drop it.
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # real client IP for the audit log
  proxy_set_header X-Forwarded-Proto $scheme;

  # Container addresses are looked up through Docker's DNS on each request (cached 10 s), not once when nginx starts. An update
  # ('docker compose up -d' after a build) recreates the changed containers with new addresses but keeps this gateway running;
  # with addresses fixed at start the gateway then sent requests to whichever container got the old address (seen on 18 Nov 2026:
  # the receipts screen served in place of the shell). A host name in a variable makes nginx resolve it at request time.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $cashflow   cashflow-api:8080;
  set $reference  reference-api:8080;
  set $accounts   accounts-api:8080;
  set $requests   requests-api:8080;
  set $receipts   remote-receipts;
  set $basicinfo  remote-basic-info;
  set $reqremote  remote-requests;
  set $keycloak   keycloak:8080;
  set $shell      shell;

  # With a variable nginx passes the request's path unchanged, so the remotes' prefix is removed by a rewrite first.
  location /api/cashflow/        { proxy_pass http://$cashflow; }
  location /api/reference/       { proxy_pass http://$reference; }
  location /api/accounts/        { proxy_pass http://$accounts; }
  location /api/requests/        { proxy_pass http://$requests; }
  location /remotes/receipts/    { rewrite ^/remotes/receipts/(.*)$ /$1 break;   proxy_pass http://$receipts; }
  location /remotes/basic-info/  { rewrite ^/remotes/basic-info/(.*)$ /$1 break; proxy_pass http://$basicinfo; }
  location /remotes/requests/    { rewrite ^/remotes/requests/(.*)$ /$1 break;   proxy_pass http://$reqremote; }
  location /auth/                { proxy_pass http://$keycloak; }
  location /                     { proxy_pass http://$shell; }
}
