# Single entry point (compact on-premises profile). Production: TLS terminates here (certificates mounted in /etc/nginx/certs).
server {
  listen 80;
  client_max_body_size 20m;
  # $http_host keeps the port the browser used (e.g. :8080); with $host, Keycloak and redirects would drop it.
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # real client IP for the audit log
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/cashflow/        { proxy_pass http://cashflow-api:8080; }
  location /api/reference/       { proxy_pass http://reference-api:8080; }
  location /remotes/receipts/    { proxy_pass http://remote-receipts/; }
  location /remotes/basic-info/  { proxy_pass http://remote-basic-info/; }
  location /auth/                { proxy_pass http://keycloak:8080/auth/; }
  location /                     { proxy_pass http://shell; }
}
