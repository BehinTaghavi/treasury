name: ci
# Required status checks for main (branch protection): dotnet, database-and-migration, frontend, compose.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet build Treasury.slnx -c Release
      # The PostgreSQL adapter tests need TREASURY_TEST_PG; on CI they fail (not skip) without it.
      - run: dotnet test --solution Treasury.slnx -c Release --no-build
        env: { TREASURY_TEST_PG: "Host=localhost;Username=postgres;Password=postgres" }
      # Offline mode (no NuGet) must keep building: some workspaces have no NuGet access.
      - run: dotnet build Treasury.Offline.slnf -p:Offline=true

  database-and-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/migration/requirements.txt
      - run: pytest db/postgres/tests
        env: { TREASURY_TEST_DSN: "host=localhost user=postgres dbname=treasury_test" }
      - run: cd tools/migration && pytest
        env: { TREASURY_TEST_DSN: "host=localhost user=postgres dbname=treasury_migration_test" }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }   # pnpm version from its packageManager field
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm test && pnpm build

  # The whole compact deployment (deploy/docker-compose.yml) built and checked through the gateway.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Throw-away passwords for this run
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "CASHFLOW_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "REFERENCE_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "ACCOUNTS_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "GATEWAY_PORT=8080"
          } > deploy/.env
      - run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
      - run: deploy/smoke-test.sh http://localhost:8080
      # A stopped system must start again with its data (db-init re-runs apply.sh on every start).
      - name: Restart and check again
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env stop
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
          deploy/smoke-test.sh http://localhost:8080
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env ps -a && docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --tail 100
      - if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env down -v
