# Serves a static micro-frontend. Single-page app: unknown paths fall back to index.html (or 200.html for Nuxt).
server {
  listen 80;
  root /usr/share/nginx/html;
  # Relative redirects (/receipts -> /receipts/): behind the gateway nginx does not know the public host and port.
  absolute_redirect off;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy same-origin;
  location ~* \.(js|css|woff2?)$ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin *; try_files $uri =404; }
  location = /remoteEntry.js { add_header Cache-Control "no-cache"; add_header Access-Control-Allow-Origin *; }
  location = /mf-manifest.json { add_header Cache-Control "no-cache"; add_header Access-Control-Allow-Origin *; }
  location / { try_files $uri $uri/ /200.html /index.html; }
}
